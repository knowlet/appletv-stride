name: Stride
options:
  bundleIdPrefix: tw.knowlet
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  StrideCore:
    path: .
targets:
  StridePhone:
    type: application
    platform: iOS
    sources:
      - path: Apps/iPhone
        excludes: [Info.plist]
      - path: Apps/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tw.knowlet.appletvstride.controller
        INFOPLIST_FILE: Apps/iPhone/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: StrideCore
        product: StrideCore
  StrideTV:
    type: application
    platform: tvOS
    sources:
      - path: Apps/TV
        excludes: [Info.plist]
      - path: Apps/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tw.knowlet.appletvstride.tv
        INFOPLIST_FILE: Apps/TV/Info.plist
        TARGETED_DEVICE_FAMILY: "3"
    dependencies:
      - package: StrideCore
        product: StrideCore
schemes:
  StridePhone:
    build:
      targets:
        StridePhone: all
  StrideTV:
    build:
      targets:
        StrideTV: all
